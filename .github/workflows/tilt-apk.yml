name: TiltSensorApp APK

on:
  push:
    paths:
      - "TiltSensorApp/**"
      - ".github/workflows/tilt-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TiltSensorApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TiltSensorApp-debug-apk
          path: TiltSensorApp/app/build/outputs/apk/debug/*.apk
