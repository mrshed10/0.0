name: KeyboardRemoteTV build

on:
  push:
    paths:
      - "KeyboardRemoteTV/**"
      - ".github/workflows/keyboard-remote-tv.yml"
  pull_request:
    paths:
      - "KeyboardRemoteTV/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: KeyboardRemoteTV
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: keyboard-remote-tv-apk
          path: KeyboardRemoteTV/app/build/outputs/apk/**/*.apk
