name: KeyboardRemoteTV build

on:
  push:
    paths:
      - "KeyboardRemoteTV/**"
      - ".github/workflows/keyboard-remote-tv.yml"
  pull_request:
    paths:
      - "KeyboardRemoteTV/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: KeyboardRemoteTV
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: keyboard-remote-tv-apk
          path: KeyboardRemoteTV/app/build/outputs/apk/**/*.apk
      - name: Prepare APK for direct download
        if: github.event_name != 'pull_request'
        run: cp app/build/outputs/apk/release/app-release.apk KeyboardRemoteTV.apk
      - name: Publish direct-download release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: keyboard-remote-tv-latest
          name: KeyboardRemoteTV (latest build)
          target_commitish: ${{ github.sha }}
          make_latest: false
          body: "ريموت الكيبورد لأجهزة Android TV / TV Box — أحدث نسخة مبنية تلقائياً."
          files: KeyboardRemoteTV/KeyboardRemoteTV.apk
