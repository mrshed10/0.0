name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # لنشر ملف APK في إصدار (Release) برابط تحميل مباشر
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: saudi-salaries-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: live-translate-debug-apk
          path: livetranslate/build/outputs/apk/debug/*.apk
      # رابط تحميل مباشر ثابت لآخر نسخة من تطبيق الترجمة العائمة:
      # https://github.com/<owner>/<repo>/releases/download/live-translate-latest/live-translate.apk
      - name: Publish live-translate APK (direct download link)
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/ccr-f5b4324e-lqlcfm' || github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp livetranslate/build/outputs/apk/debug/livetranslate-debug.apk live-translate.apk
          gh release delete live-translate-latest --yes --cleanup-tag || true
          gh release create live-translate-latest live-translate.apk \
            --target "${{ github.sha }}" \
            --title "الترجمة العائمة — آخر نسخة" \
            --notes "نسخة تجريبية (debug) تُحدَّث تلقائياً مع كل تعديل. المصدر: ${{ github.sha }}" \
            --prerelease
