name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # لنشر ملف APK في إصدار (Release) برابط تحميل مباشر
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: saudi-salaries-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: onetap-assist-debug-apk
          path: onetap/build/outputs/apk/debug/*.apk
      # رابط تحميل مباشر ثابت لآخر نسخة من مساعد بنقرة واحدة:
      # https://github.com/<owner>/<repo>/releases/download/onetap-assist-latest/onetap-assist.apk
      - name: Publish OneTap Assist APK (direct download link)
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/ccr-a4f62a72-cj0p3l' || github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp onetap/build/outputs/apk/debug/onetap-debug.apk onetap-assist.apk
          gh release delete onetap-assist-latest --yes --cleanup-tag || true
          gh release create onetap-assist-latest onetap-assist.apk \
            --target "${{ github.sha }}" \
            --title "مساعد بنقرة واحدة — آخر نسخة" \
            --notes "نسخة تجريبية (debug) تُحدَّث تلقائياً مع كل تعديل. المصدر: ${{ github.sha }}" \
            --prerelease
