name: SurveillanceCam build

on:
  push:
    paths:
      - "SurveillanceCam/**"
      - ".github/workflows/surveillance-cam.yml"
  pull_request:
    paths:
      - "SurveillanceCam/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SurveillanceCam
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Lint (informational)
        continue-on-error: true
        run: ./gradlew lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: surveillance-cam-debug-apk
          path: SurveillanceCam/app/build/outputs/apk/debug/*.apk
