name: TV Browser build

on:
  push:
    paths:
      - "tv-browser/**"
      - ".github/workflows/tv-browser.yml"
  pull_request:
    paths:
      - "tv-browser/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tv-browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Resolved GeckoView versions
        run: |
          chmod +x gradlew
          ./gradlew -q :app:dependencies --configuration releaseRuntimeClasspath | grep -i geckoview | head -3 || true
      - name: Build release APK (armeabi-v7a, R8-minified)
        run: ./gradlew assembleRelease --stacktrace
      - name: Dump GeckoView extension API (diagnostics)
        if: failure()
        run: |
          AAR=$(find / -name 'geckoview-1*.aar' 2>/dev/null | head -1); echo "AAR=$AAR"
          JAR=$(find / -path '*geckoview*' -name 'classes.jar' 2>/dev/null | head -1); echo "JAR=$JAR"
          if [ -z "$JAR" ] && [ -n "$AAR" ]; then mkdir -p /tmp/gv && unzip -oq "$AAR" classes.jar -d /tmp/gv && JAR=/tmp/gv/classes.jar; fi
          javap -cp "$JAR" 'org.mozilla.geckoview.WebExtensionController$PromptDelegate' \
            'org.mozilla.geckoview.ContentBlocking$AntiTracking' 'org.mozilla.geckoview.GeckoRuntimeSettings$Builder' \
            'org.mozilla.geckoview.StorageController$ClearFlags' 'org.mozilla.geckoview.GeckoRuntime$Delegate' || true
      - uses: actions/upload-artifact@v4
        with:
          name: tv-browser-armeabi-v7a
          path: tv-browser/app/build/outputs/apk/release/*.apk
